[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "governance-certification"
version = "0.1.0"
description = "GovernanceCertification v1 — the enforcement-bound oversight-proof predicate schema + a reference verifier."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "flxk1" }]
keywords = ["in-toto", "dsse", "attestation", "governance", "oversight", "sigstore"]
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
schema = ["jsonschema>=4"]

[project.scripts]
govcert-verify = "verify:main"

[tool.setuptools]
py-modules = ["verify"]
